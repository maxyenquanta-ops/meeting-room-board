<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會議室預約看板 —— 衝突檢查測試</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    font: 15px/1.6 "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    color: #1f2430;
    background: #f4f6f9;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  #summary {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  #summary.pass { background: #e7f6ec; border: 1px solid #9bd3ae; color: #14612f; }
  #summary.fail { background: #fdeaea; border: 1px solid #f0b4b4; color: #a01919; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid #d5d9e0;
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid #e5e8ee;
    vertical-align: top;
  }
  th { background: #f0f2f6; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.result { white-space: nowrap; font-weight: 600; }
  tr.fail td.result { color: #a01919; }
  tr.fail { background: #fef6f6; }
  code { background: #f0f2f6; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>

<h1>衝突檢查函式測試（app.js 的 <code>hasConflict()</code>）</h1>
<div id="summary">執行中…</div>
<table>
  <thead>
    <tr>
      <th>測試名稱</th>
      <th>預期值</th>
      <th>實際值</th>
      <th>結果</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<!-- 一般 script 載入待測程式（非 ES module，直接打開即可跑） -->
<script src="app.js"></script>
<script>
/* ===================================================================
   測試用替身：app.js 的 hasConflict() 會讀取全域 state.bookings，
   因此這裡宣告一個全域 state，並在每個測試前替換 bookings 內容。
   =================================================================== */
const state = { bookings: [] };

// 產生一筆測試用預約（欄位齊全，避免與正式驗證邏輯不一致）
function 預約(id, roomId, date, startHour, endHour) {
  return {
    id, roomId, date, startHour, endHour,
    name: '測試人', topic: '測試會議', createdAt: '2026-09-03T00:00:00.000Z',
  };
}

const 結果清單 = [];

// 執行單一測試案例
// existing：既有預約陣列；args：傳給 hasConflict 的參數；expected：預期布林值
function 測試(名稱, existing, args, expected) {
  state.bookings = existing;
  let 實際;
  try {
    實際 = hasConflict(...args);
  } catch (e) {
    實際 = '（例外：' + e.message + '）';
  }
  結果清單.push({ 名稱, expected, 實際, 通過: 實際 === expected });
}

const D = '2026-09-03';   // 測試基準日期
const D2 = '2026-09-04';  // 另一天

/* ---------- 一般情況 ---------- */

測試(
  '完全相同時段（同室同日）→ 應判定衝突',
  [預約('x1', 'A', D, 10, 12)],
  ['A', D, 10, 12, null],
  true
);

測試(
  '完全錯開的時段（09–10 vs 14–15，同室同日）→ 不衝突',
  [預約('x1', 'A', D, 9, 10)],
  ['A', D, 14, 15, null],
  false
);

/* ---------- 邊界情況 ---------- */

測試(
  '部分重疊（前段）：既有 10–12，新 09–11 → 應判定衝突',
  [預約('x1', 'A', D, 10, 12)],
  ['A', D, 9, 11, null],
  true
);

測試(
  '部分重疊（後段）：既有 10–12，新 11–13 → 應判定衝突',
  [預約('x1', 'A', D, 10, 12)],
  ['A', D, 11, 13, null],
  true
);

測試(
  '完全包含：既有 10–16，新 12–14（被包在內）→ 應判定衝突',
  [預約('x1', 'A', D, 10, 16)],
  ['A', D, 12, 14, null],
  true
);

測試(
  '完全包含（反向）：既有 12–14，新 10–16（涵蓋既有）→ 應判定衝突',
  [預約('x1', 'A', D, 12, 14)],
  ['A', D, 10, 16, null],
  true
);

測試(
  '緊鄰時段：既有 10–12，新 12–14 → 應允許（不衝突）',
  [預約('x1', 'A', D, 10, 12)],
  ['A', D, 12, 14, null],
  false
);

測試(
  '緊鄰時段（前側）：既有 12–14，新 10–12 → 應允許（不衝突）',
  [預約('x1', 'A', D, 12, 14)],
  ['A', D, 10, 12, null],
  false
);

測試(
  '不同會議室同時段：既有 A 10–12，新 B 10–12 → 應允許（不衝突）',
  [預約('x1', 'A', D, 10, 12)],
  ['B', D, 10, 12, null],
  false
);

測試(
  '不同日期同時段：既有 09-03 10–12，新 09-04 10–12 → 應允許（不衝突）',
  [預約('x1', 'A', D, 10, 12)],
  ['A', D2, 10, 12, null],
  false
);

測試(
  '修改自己：既有 x1 10–12，以 excludeId=x1 檢查同時段 → 應排除自己（不衝突）',
  [預約('x1', 'A', D, 10, 12)],
  ['A', D, 10, 12, 'x1'],
  false
);

測試(
  '多筆既有預約：只與其中一筆重疊（13–15 撞 14–16）→ 應判定衝突',
  [預約('x1', 'A', D, 9, 10), 預約('x2', 'A', D, 14, 16)],
  ['A', D, 13, 15, null],
  true
);

測試(
  '空的預約清單 → 不衝突',
  [],
  ['A', D, 10, 12, null],
  false
);

/* ---------- 輸出 ---------- */
const rowsEl = document.getElementById('rows');
let 通過數 = 0;
for (const r of 結果清單) {
  if (r.通過) 通過數++;
  const tr = document.createElement('tr');
  if (!r.通過) tr.className = 'fail';
  tr.innerHTML =
    '<td>' + r.名稱 + '</td>' +
    '<td>' + String(r.expected) + '</td>' +
    '<td>' + String(r.實際) + '</td>' +
    '<td class="result">' + (r.通過 ? '✅' : '❌') + '</td>';
  rowsEl.appendChild(tr);
}

const 總數 = 結果清單.length;
const summaryEl = document.getElementById('summary');
summaryEl.textContent = `通過 ${通過數} 項／共 ${總數} 項` + (通過數 === 總數 ? '（全部通過）' : `（${總數 - 通過數} 項失敗）`);
summaryEl.className = 通過數 === 總數 ? 'pass' : 'fail';
</script>
</body>
</html>
